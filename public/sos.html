<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SOS course</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#d92d20" data-fixed>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SOS">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body class="sos-page">
  <main class="sos-main">
    <div class="sos-top">
      <button type="button" class="icon-btn" data-theme-toggle aria-label="Changer de thème">
        <svg class="theme-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <h1>Besoin d'aide ?</h1>
    <p class="muted">Maintiens le bouton <strong>2 secondes</strong> : tes contacts de confiance reçoivent une alerte avec ta position.</p>

    <button id="sosBtn" class="sos-btn" type="button" aria-label="Envoyer un SOS (maintenir 2 secondes)">
      <svg class="sos-ring" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="47"></circle></svg>
      <span>SOS</span>
    </button>

    <label class="sos-note">Message (facultatif)
      <input id="note" maxlength="200" placeholder="Ex : cheville tordue au km 18">
    </label>

    <p id="sosStatus" class="sos-status" role="status" aria-live="assertive"></p>
    <button id="okBtn" class="ok-btn" type="button" hidden>Je vais bien : annuler l'alerte</button>
    <p id="sosOutdated" class="sos-status error" hidden>Ce lien SOS est ancien : ouvre le nouveau lien de l'admin (section Sécurité) pour pouvoir lever l'alerte.</p>

    <p class="muted small sos-help">En cas d'urgence vitale, appelle le <a href="tel:112">112</a>.</p>
  </main>
  <script src="/sos.js"></script>
</body>
</html>
