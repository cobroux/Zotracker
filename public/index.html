<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Suivi en direct</title>
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body class="public">
  <main class="layout">
    <section class="map-wrap" aria-label="Carte du parcours">
      <div id="map"></div>
      <header class="hero">
        <div class="avatar" id="avatar"></div>
        <div class="hero-text">
          <h1 id="runnerName">Suivi en direct</h1>
          <p id="raceLine" class="hero-race"></p>
        </div>
        <span id="statusBadge" class="badge">…</span>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Changer de thème">
          <svg class="theme-ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="theme-ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </header>
      <button id="followBtn" class="map-btn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
        Suivre le coureur
      </button>
      <div id="offline" class="map-banner" hidden>Connexion perdue, reconnexion…</div>
      <div id="alertBanner" class="alert-banner" role="status" aria-live="polite" hidden></div>
    </section>

    <aside class="panel">
      <div id="countdown" class="countdown" hidden></div>

      <section class="distance" aria-label="Progression">
        <div class="distance-head">
          <div>
            <span class="caps">Distance parcourue</span>
            <span class="big-num"><span id="sDone">0,00</span><span id="sTotal" class="unit"> km</span></span>
          </div>
          <span id="progressPct" class="pct"></span>
        </div>
        <div class="progress-bar" id="progressBox"><div id="progressFill"></div></div>
        <span id="updated" class="muted small"></span>
      </section>

      <div class="stats">
        <div class="stat"><span class="label">Temps</span><span class="value" id="sTime">–</span></div>
        <div class="stat"><span class="label">Allure moy.</span><span class="value" id="sAvg">–</span></div>
        <div class="stat"><span class="label">Allure récente</span><span class="value" id="sRecent">–</span></div>
        <div class="stat"><span class="label">Restant</span><span class="value" id="sLeft">–</span></div>
        <div class="stat wide highlight"><span class="label" id="sEtaLabel">Arrivée estimée</span><span class="value" id="sEta">–</span></div>
      </div>

      <p id="offCourse" class="warning" hidden>Le coureur semble s'être écarté du parcours.</p>
      <div id="nextAid" class="next-aid" hidden></div>

      <div id="alertBox" class="alert-box">
        <button id="alertBtn" type="button" hidden>Être alerté</button>
        <span id="alertStatus" class="muted small"></span>
      </div>

      <canvas id="profile" class="profile" hidden aria-label="Profil d'altitude du parcours" role="img"></canvas>

      <section id="messagesCard" class="card" hidden>
        <h2>En direct</h2>
        <ul id="messages" class="messages"></ul>
      </section>

      <section id="aidCard" class="card" hidden>
        <h2>Ravitaillements</h2>
        <ol id="aidList" class="aid-timeline"></ol>
      </section>

      <section id="aboutCard" class="card" hidden>
        <h2 id="aboutTitle">À propos</h2>
        <p id="goal" class="goal" hidden></p>
        <p id="bio" class="bio"></p>
        <dl id="facts" class="facts"></dl>
      </section>

      <section id="raceCard" class="card" hidden>
        <h2>La course</h2>
        <p id="raceDesc" class="bio"></p>
        <dl id="raceFacts" class="facts"></dl>
      </section>
    </aside>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script src="/tiles.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
