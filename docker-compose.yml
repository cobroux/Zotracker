# Lancer Zotracker sur ton ordinateur (aucune configuration nécessaire) :
#
#   docker compose up --build
#
# puis ouvre http://localhost:3000 (page publique) et http://localhost:3000/admin
# Le mot de passe admin généré s'affiche dans les journaux au premier lancement
# (ou choisis-le : ADMIN_PASSWORD=monmotdepasse docker compose up --build).
#
# Pour la mise en ligne sur un serveur (HTTPS, Caddy…), utilise deploy/docker-compose.yml
# et suis docs/DEPLOIEMENT.md.
name: zotracker-local

services:
  app:
    build: .
    image: zotracker:local
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Pas de reverse proxy ici : TRUST_PROXY reste à son défaut (« loopback »), X-Forwarded-For
      # est ignoré et l'IP vue est celle de la passerelle Docker (limites de débit communes, sans
      # conséquence en local). Ne pas mettre « uniquelocal » ici : l'en-tête deviendrait falsifiable.
      # fond de carte optionnel (ex. MapTiler), lu depuis un fichier .env à la racine
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
    ports:
      # par défaut, joignable uniquement depuis cet ordinateur ; pour tester avec ton téléphone
      # sur le même réseau : BIND_ADDR=0.0.0.0 docker compose up --build
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - data:/app/data
    # même durcissement qu'en production
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true

volumes:
  data: {}
