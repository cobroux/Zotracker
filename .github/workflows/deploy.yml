# Livraison continue : à chaque push sur main, CI verte, puis déploiement SSH sur la VM Oracle
# (clé à commande forcée : le serveur construit lui-même l'image ; plus de registre ghcr).
# Inactif tant que DEPLOY_ENABLED != true ou que le secret DEPLOY_HOST est absent (sortie propre).
name: Déploiement

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: Déployer en production
    needs: ci
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {}
    environment:
      name: production
      url: https://${{ vars.DOMAIN }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DOMAIN: ${{ vars.DOMAIN }}
      SHA: ${{ github.sha }}
    steps:
      - name: Vérifier la configuration
        id: cfg
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DOMAIN" ]; then
            echo "Secrets de déploiement absents : déploiement ignoré."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Préparer la connexion SSH (clé dédiée, empreinte du serveur vérifiée)
        if: steps.cfg.outputs.go == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Déployer (sauvegarde, build, santé, retour arrière côté serveur)
        if: steps.cfg.outputs.go == 'true'
        # la clé est limitée côté serveur à deploy.sh ; le SHA est la seule donnée transmise
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "$SHA"
      - name: Vérifier le site en ligne
        id: health
        if: steps.cfg.outputs.go == 'true'
        run: curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://$DOMAIN/healthz"
      - name: Retour arrière si le site public ne répond pas
        # seulement si l'échec vient du contrôle public : deploy.sh a déjà fait son propre retour si lui a échoué
        if: steps.health.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" rollback
      - name: Supprimer la clé
        if: always() && steps.cfg.outputs.go == 'true'
        run: rm -f ~/.ssh/deploy_key
